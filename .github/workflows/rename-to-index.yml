name: Rename to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html from uploaded file
        run: |
          set -e
          test -f render-to-reality.html
          SRC_SIZE=$(stat -c%s render-to-reality.html)
          echo "source_size=$SRC_SIZE"
          if [ "$SRC_SIZE" -lt 20000000 ]; then echo "Source too small, aborting before touching index.html"; exit 1; fi
          cp render-to-reality.html index.html.tmp
          TMP_SIZE=$(stat -c%s index.html.tmp)
          if [ "$TMP_SIZE" != "$SRC_SIZE" ]; then echo "Temp copy size mismatch, aborting"; exit 1; fi
          mv index.html.tmp index.html
          rm render-to-reality.html
          ls -l index.html CNAME
          test "$(stat -c%s index.html)" -ge 20000000
      - name: Commit replacement
        run: |
          git config user.name "abubakarshahzadakhtar-spec"
          git config user.email "abubakarshahzadakhtar-spec@users.noreply.github.com"
          git add index.html render-to-reality.html
          git status --short
          git commit -m "Replace index.html with fixed Render to Reality website (detail images fixed)"
          git push
