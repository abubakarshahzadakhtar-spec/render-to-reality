name: Rename to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "abubakarshahzadakhtar-spec"
          git config user.email "abubakarshahzadakhtar@gmail.com"
          git mv render-to-reality.html index.html
          git commit -m "Rename render-to-reality.html to index.html"
          git push
